[package]
name = "mdrix"
version = "0.1.0"
description = "Editor Markdown Mdrix para Linux"
authors = ["Mdrix contributors"]
edition = "2021"

[lib]
name = "mdrix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"
